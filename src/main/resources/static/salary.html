<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        .navbar {
            background: #1e3c72;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 24px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: #ff4757;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .form-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .form-card h2 {
            color: #1e3c72;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .save-btn {
            background: #1e3c72;
            color: white;
            margin-top: 20px;
        }

        .clear-btn {
            background: #777;
            color: white;
            margin-top: 20px;
            margin-left: 10px;
        }

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        .table-card h2 {
            color: #1e3c72;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1e3c72;
            color: white;
            padding: 14px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f7fa;
        }

        .edit-btn {
            background: #ffa502;
            color: white;
            margin-right: 5px;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
        }

        .net {
            font-weight: bold;
            color: #16a085;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 15px;
            }

            .container {
                width: 95%;
            }
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>💰 Salary Management</h2>
    <a href="dashboard.html">Dashboard</a>
</div>

<div class="container">

    <div class="form-card">

        <h2 id="formTitle">Add Salary</h2>

        <div class="form-grid">

            <input type="number" id="employeeId" placeholder="Employee ID">

            <input type="number" id="basicSalary" placeholder="Basic Salary">

            <input type="number" id="allowances" placeholder="Allowances">

            <input type="number" id="deductions" placeholder="Deductions">

        </div>

        <button class="save-btn" onclick="saveSalary()">
            Save Salary
        </button>

        <button class="clear-btn" onclick="clearForm()">
            Clear
        </button>

        <div id="message"></div>

    </div>


    <div class="table-card">

        <h2>Salary Details</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Employee ID</th>
                    <th>Basic Salary</th>
                    <th>Allowances</th>
                    <th>Deductions</th>
                    <th>Net Salary</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="salaryTable">
            </tbody>

        </table>

    </div>

</div>


<script>

let editId = null;

const username = sessionStorage.getItem("username");
const password = sessionStorage.getItem("password");

if (!username || !password) {
    window.location.href = "login.html";
}

const auth = "Basic " + btoa(username + ":" + password);


function loadSalaries() {

    fetch("/api/salaries", {
        method: "GET",
        headers: {
            "Authorization": auth
        }
    })
    .then(response => {

        if (!response.ok) {
            throw new Error("Failed to load salaries");
        }

        return response.json();

    })
    .then(data => {

        const table = document.getElementById("salaryTable");

        table.innerHTML = "";

        data.forEach(salary => {

            const row = `
                <tr>

                    <td>${salary.id}</td>

                    <td>${salary.employeeId}</td>

                    <td>₹${salary.basicSalary.toFixed(2)}</td>

                    <td>₹${salary.allowances.toFixed(2)}</td>

                    <td>₹${salary.deductions.toFixed(2)}</td>

                    <td class="net">
                        ₹${salary.netSalary.toFixed(2)}
                    </td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editSalary(${salary.id})">
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteSalary(${salary.id})">
                            Delete
                        </button>

                    </td>

                </tr>
            `;

            table.innerHTML += row;

        });

    })
    .catch(error => {

        document.getElementById("message").innerText =
            error.message;

    });
}


function saveSalary() {

    const employeeId =
        document.getElementById("employeeId").value;

    const basicSalary =
        document.getElementById("basicSalary").value;

    const allowances =
        document.getElementById("allowances").value;

    const deductions =
        document.getElementById("deductions").value;


    if (!employeeId || !basicSalary) {

        document.getElementById("message").innerText =
            "Please enter Employee ID and Basic Salary";

        return;
    }


    const salary = {

        employeeId: Number(employeeId),

        basicSalary: Number(basicSalary),

        allowances: Number(allowances || 0),

        deductions: Number(deductions || 0)

    };


    let url = "/api/salaries";

    let method = "POST";


    if (editId !== null) {

        url = "/api/salaries/" + editId;

        method = "PUT";

    }


    fetch(url, {

        method: method,

        headers: {

            "Authorization": auth,

            "Content-Type": "application/json"

        },

        body: JSON.stringify(salary)

    })

    .then(response => {

        if (!response.ok) {

            throw new Error("Failed to save salary");

        }

        return response.json();

    })

    .then(data => {

        document.getElementById("message").innerText =
            "Salary saved successfully";

        clearForm();

        loadSalaries();

    })

    .catch(error => {

        document.getElementById("message").innerText =
            error.message;

    });
}


function editSalary(id) {

    fetch("/api/salaries/" + id, {

        method: "GET",

        headers: {

            "Authorization": auth

        }

    })

    .then(response => response.json())

    .then(salary => {

        editId = salary.id;

        document.getElementById("employeeId").value =
            salary.employeeId;

        document.getElementById("basicSalary").value =
            salary.basicSalary;

        document.getElementById("allowances").value =
            salary.allowances;

        document.getElementById("deductions").value =
            salary.deductions;

        document.getElementById("formTitle").innerText =
            "Update Salary";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    });
}


function deleteSalary(id) {

    if (!confirm("Are you sure you want to delete this salary?")) {
        return;
    }


    fetch("/api/salaries/" + id, {

        method: "DELETE",

        headers: {

            "Authorization": auth

        }

    })

    .then(response => response.text())

    .then(data => {

        document.getElementById("message").innerText = data;

        loadSalaries();

    })

    .catch(error => {

        document.getElementById("message").innerText =
            "Failed to delete salary";

    });
}


function clearForm() {

    editId = null;

    document.getElementById("employeeId").value = "";

    document.getElementById("basicSalary").value = "";

    document.getElementById("allowances").value = "";

    document.getElementById("deductions").value = "";

    document.getElementById("formTitle").innerText =
        "Add Salary";
}


loadSalaries();

</script>

</body>
</html>
