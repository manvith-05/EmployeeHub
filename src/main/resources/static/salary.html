<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Management - EmployeeHub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        .navbar {
            background: #1e3c72;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            background: #ff4757;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .form-card, .table-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h2 {
            color: #1e3c72;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 20px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .save-btn {
            background: #1e3c72;
            color: white;
        }

        .clear-btn {
            background: #777;
            color: white;
            margin-left: 10px;
        }

        .logout-btn {
            background: #c0392b;
            color: white;
            margin: 0;
        }

        .table-card {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th {
            background: #1e3c72;
            color: white;
            padding: 14px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f7fa;
        }

        .edit-btn {
            background: #ffa502;
            color: white;
            margin: 4px;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            margin: 4px;
        }

        .net {
            font-weight: bold;
            color: #16a085;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            white-space: pre-wrap;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 15px;
            }

            .container {
                width: 95%;
            }
        }
    </style>
</head>
<body>

<div class="navbar">
    <h2 style="color:white; margin:0;">EmployeeHub - Salary Management</h2>
    <div>
        <a href="/dashboard.html">Dashboard</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">
    <div class="form-card">
        <h2 id="formTitle">Add Salary</h2>

        <div class="form-grid">
            <input type="number" id="employeeId" placeholder="Employee ID" min="1">
            <input type="number" id="basicSalary" placeholder="Basic Salary" min="0" step="0.01">
            <input type="number" id="allowances" placeholder="Allowances" min="0" step="0.01">
            <input type="number" id="deductions" placeholder="Deductions" min="0" step="0.01">
        </div>

        <button class="save-btn" id="saveButton" onclick="saveSalary()">Save Salary</button>
        <button class="clear-btn" onclick="clearForm()">Clear</button>
        <div id="message" role="status" aria-live="polite"></div>
    </div>

    <div class="table-card">
        <h2>Salary Details</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Employee ID</th>
                    <th>Basic Salary</th>
                    <th>Allowances</th>
                    <th>Deductions</th>
                    <th>Net Salary</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="salaryTable"></tbody>
        </table>
    </div>
</div>

<script>
let editId = null;

const message = document.getElementById("message");
const table = document.getElementById("salaryTable");
const saveButton = document.getElementById("saveButton");

async function apiRequest(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        credentials: "same-origin",
        headers: {
            ...(options.headers || {})
        }
    });

    if (response.status === 401 || response.status === 403) {
        throw new Error(
            response.status === 401
                ? "Your login session has expired. Please log in again."
                : "Access denied. Please log in with an admin account."
        );
    }

    if (!response.ok) {
        const details = await response.text();
        throw new Error(details || "Request failed: " + response.status);
    }

    return response;
}

function showError(error, fallback) {
    message.textContent = error.message || fallback;

    if (error.message.includes("login session") ||
        error.message.includes("Access denied")) {
        setTimeout(() => {
            window.location.replace("/login.html");
        }, 1800);
    }
}

function formatMoney(value) {
    return "₹" + Number(value || 0).toFixed(2);
}

async function loadSalaries() {
    table.replaceChildren();
    message.textContent = "Loading salaries...";

    try {
        const response = await apiRequest("/api/salaries");
        const salaries = await response.json();

        if (!Array.isArray(salaries) || salaries.length === 0) {
            message.textContent = "No salary records found.";
            return;
        }

        salaries.forEach(salary => {
            const row = document.createElement("tr");

            const values = [
                salary.id,
                salary.employeeId,
                formatMoney(salary.basicSalary),
                formatMoney(salary.allowances),
                formatMoney(salary.deductions),
                formatMoney(
                    salary.netSalary ??
                    (Number(salary.basicSalary || 0) +
                     Number(salary.allowances || 0) -
                     Number(salary.deductions || 0))
                )
            ];

            values.forEach((value, index) => {
                const cell = document.createElement("td");
                cell.textContent = value;
                if (index === 5) {
                    cell.className = "net";
                }
                row.appendChild(cell);
            });

            const actions = document.createElement("td");

            const editButton = document.createElement("button");
            editButton.className = "edit-btn";
            editButton.textContent = "Edit";
            editButton.onclick = () => editSalary(salary.id);

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-btn";
            deleteButton.textContent = "Delete";
            deleteButton.onclick = () => deleteSalary(salary.id);

            actions.append(editButton, deleteButton);
            row.appendChild(actions);
            table.appendChild(row);
        });

        message.textContent = "";
    } catch (error) {
        showError(error, "Failed to load salaries.");
    }
}

async function saveSalary() {
    const employeeId = Number(document.getElementById("employeeId").value);
    const basicSalary = Number(document.getElementById("basicSalary").value);
    const allowances = Number(document.getElementById("allowances").value || 0);
    const deductions = Number(document.getElementById("deductions").value || 0);

    if (!employeeId || employeeId < 1 ||
        document.getElementById("basicSalary").value === "" ||
        basicSalary < 0 || allowances < 0 || deductions < 0) {
        message.textContent = "Enter a valid Employee ID and salary amounts.";
        return;
    }

    const salary = {
        employeeId,
        basicSalary,
        allowances,
        deductions
    };

    const isEditing = editId !== null;
    const url = isEditing
        ? "/api/salaries/" + editId
        : "/api/salaries";

    saveButton.disabled = true;
    message.textContent = "Saving salary...";

    try {
        await apiRequest(url, {
            method: isEditing ? "PUT" : "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(salary)
        });

        clearForm();
        message.textContent = isEditing
            ? "Salary updated successfully."
            : "Salary saved successfully.";

        await loadSalaries();
    } catch (error) {
        showError(error, "Failed to save salary.");
    } finally {
        saveButton.disabled = false;
    }
}

async function editSalary(id) {
    try {
        const response = await apiRequest("/api/salaries/" + id);
        const salary = await response.json();

        editId = salary.id;
        document.getElementById("employeeId").value = salary.employeeId ?? "";
        document.getElementById("basicSalary").value = salary.basicSalary ?? "";
        document.getElementById("allowances").value = salary.allowances ?? 0;
        document.getElementById("deductions").value = salary.deductions ?? 0;
        document.getElementById("formTitle").textContent = "Update Salary";
        saveButton.textContent = "Update Salary";

        message.textContent = "Editing salary record " + id;
        window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (error) {
        showError(error, "Unable to load salary details.");
    }
}

async function deleteSalary(id) {
    if (!confirm("Are you sure you want to delete this salary?")) {
        return;
    }

    try {
        await apiRequest("/api/salaries/" + id, {
            method: "DELETE"
        });

        clearForm();
        message.textContent = "Salary deleted successfully.";
        await loadSalaries();
    } catch (error) {
        showError(error, "Failed to delete salary.");
    }
}

function clearForm() {
    editId = null;
    document.getElementById("employeeId").value = "";
    document.getElementById("basicSalary").value = "";
    document.getElementById("allowances").value = "";
    document.getElementById("deductions").value = "";
    document.getElementById("formTitle").textContent = "Add Salary";
    saveButton.textContent = "Save Salary";
}

async function logout() {
    try {
        await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "same-origin"
        });
    } finally {
        window.location.replace("/login.html");
    }
}

loadSalaries();
</script>

</body>
</html>
