<!DOCTYPE html>
<html>
<head>
    <title>Employee Management</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #667eea;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .form-card,
        .table-card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            cursor: pointer;
            margin-top: 15px;
        }

        .delete {
            background: #e74c3c;
        }

        .edit {
            background: #f39c12;
        }

        .dashboard {
            background: #333;
            margin-left: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        @media(max-width:700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>👨‍💼 Employee Management</h1>
</div>

<div class="container">

    <div class="form-card">

        <h2 id="title">Add Employee</h2>

        <div class="form-grid">

            <input id="name" placeholder="Employee Name">

            <input id="email" placeholder="Email">

            <input id="phone" placeholder="Phone">

            <input id="address" placeholder="Address">

            <input id="department" placeholder="Department">

            <input id="salary" type="number" placeholder="Salary">

        </div>

        <button onclick="saveEmployee()">Save Employee</button>

        <button onclick="clearForm()">Clear</button>

        <button class="dashboard"
                onclick="window.location.href='/dashboard.html'">
            Dashboard
        </button>

        <p id="message"></p>

    </div>

    <div class="table-card">

        <h2>Employee List</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="employeeTable"></tbody>

        </table>

    </div>

</div>

<script>

let editId = null;

const username = sessionStorage.getItem("username");
const password = sessionStorage.getItem("password");

if (!username || !password) {
    window.location.href = "/login.html";
}

const auth = "Basic " + btoa(username + ":" + password);

function loadEmployees() {

    fetch("/api/employees", {
        headers: {
            "Authorization": auth
        }
    })
    .then(response => response.json())
    .then(data => {

        const table = document.getElementById("employeeTable");

        table.innerHTML = "";

        data.forEach(employee => {

            table.innerHTML += `
                <tr>
                    <td>${employee.id}</td>
                    <td>${employee.name}</td>
                    <td>${employee.email}</td>
                    <td>${employee.phone}</td>
                    <td>${employee.address}</td>
                    <td>${employee.department}</td>
                    <td>₹${employee.salary}</td>
                    <td>
                        <button class="edit"
                            onclick="editEmployee(${employee.id})">
                            Edit
                        </button>

                        <button class="delete"
                            onclick="deleteEmployee(${employee.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
        });
    })
    .catch(() => {
        document.getElementById("message").innerText =
            "Failed to load employees";
    });
}

function saveEmployee() {

    const employee = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        address: document.getElementById("address").value,
        department: document.getElementById("department").value,
        salary: Number(document.getElementById("salary").value)
    };

    let url = "/api/employees";
    let method = "POST";

    if (editId !== null) {
        url = "/api/employees/" + editId;
        method = "PUT";
    }

    fetch(url, {
        method: method,
        headers: {
            "Authorization": auth,
            "Content-Type": "application/json"
        },
        body: JSON.stringify(employee)
    })
    .then(response => response.json())
    .then(() => {

        document.getElementById("message").innerText =
            "Employee saved successfully";

        clearForm();
        loadEmployees();
    })
    .catch(() => {

        document.getElementById("message").innerText =
            "Failed to save employee";
    });
}

function editEmployee(id) {

    fetch("/api/employees/" + id, {
        headers: {
            "Authorization": auth
        }
    })
    .then(response => response.json())
    .then(employee => {

        editId = employee.id;

        document.getElementById("name").value = employee.name;
        document.getElementById("email").value = employee.email;
        document.getElementById("phone").value = employee.phone;
        document.getElementById("address").value = employee.address;
        document.getElementById("department").value = employee.department;
        document.getElementById("salary").value = employee.salary;

        document.getElementById("title").innerText =
            "Update Employee";
    });
}

function deleteEmployee(id) {

    if (!confirm("Delete this employee?")) {
        return;
    }

    fetch("/api/employees/" + id, {
        method: "DELETE",
        headers: {
            "Authorization": auth
        }
    })
    .then(response => response.text())
    .then(message => {

        document.getElementById("message").innerText = message;

        loadEmployees();
    });
}

function clearForm() {

    editId = null;

    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("address").value = "";
    document.getElementById("department").value = "";
    document.getElementById("salary").value = "";

    document.getElementById("title").innerText =
        "Add Employee";
}

loadEmployees();

</script>

</body>
</html>
