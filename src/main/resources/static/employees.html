<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management - EmployeeHub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #667eea;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .form-card, .table-card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            width: 100%;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            cursor: pointer;
            margin: 10px 5px 0 0;
        }

        button:hover {
            opacity: 0.9;
        }

        .delete {
            background: #e74c3c;
        }

        .edit {
            background: #f39c12;
        }

        .dashboard {
            background: #333;
        }

        .logout {
            background: #e74c3c;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        #message {
            font-weight: bold;
            margin-top: 15px;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>EmployeeHub</h1>
    <h2>Employee Management</h2>
</div>

<div class="container">

    <div class="form-card">
        <h2 id="title">Add Employee</h2>

        <div class="form-grid">
            <input id="name" placeholder="Employee Name" required>
            <input id="email" type="email" placeholder="Email" required>
            <input id="phone" placeholder="Phone" required>
            <input id="address" placeholder="Address" required>
            <input id="department" placeholder="Department" required>
            <input id="salary" type="number" min="0" placeholder="Salary" required>
        </div>

        <button onclick="saveEmployee()">Save Employee</button>
        <button onclick="clearForm()">Clear</button>
        <button class="dashboard"
                onclick="window.location.href='/dashboard.html'">
            Dashboard
        </button>
        <button class="logout" onclick="logout()">Logout</button>

        <p id="message"></p>
    </div>

    <div class="table-card">
        <h2>Employee List</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTable"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    let editId = null;

    async function apiRequest(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            credentials: "same-origin",
            headers: {
                ...(options.headers || {})
            }
        });

        if (response.status === 401 || response.status === 403) {
            document.getElementById("message").innerText =
                "Access denied. Please log in with an admin account.";
            throw new Error("Authentication or authorization failed");
        }

        if (!response.ok) {
            throw new Error("Request failed: " + response.status);
        }

        return response;
    }

    async function loadEmployees() {
        const table = document.getElementById("employeeTable");
        const message = document.getElementById("message");

        try {
            const response = await apiRequest("/api/employees");
            const employees = await response.json();

            table.innerHTML = "";

            employees.forEach(employee => {
                const row = document.createElement("tr");

                [
                    employee.id,
                    employee.name,
                    employee.email,
                    employee.phone,
                    employee.address,
                    employee.department,
                    "₹" + employee.salary
                ].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value ?? "";
                    row.appendChild(cell);
                });

                const actions = document.createElement("td");

                const editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.className = "edit";
                editButton.onclick = () => editEmployee(employee.id);

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "delete";
                deleteButton.onclick = () => deleteEmployee(employee.id);

                actions.appendChild(editButton);
                actions.appendChild(deleteButton);
                row.appendChild(actions);
                table.appendChild(row);
            });

            message.textContent = employees.length === 0
                ? "No employees found."
                : "";

        } catch (error) {
            if (error.message !== "Authentication or authorization failed") {
                message.textContent = "Failed to load employees. Please try again.";
            }
        }
    }

    async function saveEmployee() {
        const message = document.getElementById("message");

        const employee = {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            address: document.getElementById("address").value.trim(),
            department: document.getElementById("department").value.trim(),
            salary: Number(document.getElementById("salary").value)
        };

        if (!employee.name || !employee.email || !employee.phone ||
            !employee.address || !employee.department ||
            document.getElementById("salary").value === "" ||
            employee.salary < 0) {
            message.textContent = "Please fill in all fields correctly.";
            return;
        }

        const url = editId === null
            ? "/api/employees"
            : "/api/employees/" + editId;

        const method = editId === null ? "POST" : "PUT";

        try {
            const response = await apiRequest(url, {
                method: method,
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(employee)
            });

            message.textContent = await response.text()
                .then(text => text || "Employee saved successfully.");

            clearForm();
            await loadEmployees();

        } catch (error) {
            if (error.message !== "Authentication or authorization failed") {
                message.textContent = "Failed to save employee.";
            }
        }
    }

    async function editEmployee(id) {
        try {
            const response = await apiRequest("/api/employees/" + id);
            const employee = await response.json();

            editId = employee.id;

            document.getElementById("name").value = employee.name || "";
            document.getElementById("email").value = employee.email || "";
            document.getElementById("phone").value = employee.phone || "";
            document.getElementById("address").value = employee.address || "";
            document.getElementById("department").value = employee.department || "";
            document.getElementById("salary").value = employee.salary ?? "";

            document.getElementById("title").textContent = "Update Employee";
            document.getElementById("message").textContent =
                "Update the details and click Save Employee.";

            window.scrollTo({ top: 0, behavior: "smooth" });

        } catch (error) {
            if (error.message !== "Authentication or authorization failed") {
                document.getElementById("message").textContent =
                    "Failed to load employee details.";
            }
        }
    }

    async function deleteEmployee(id) {
        if (!confirm("Are you sure you want to delete this employee?")) {
            return;
        }

        try {
            await apiRequest("/api/employees/" + id, {
                method: "DELETE"
            });

            document.getElementById("message").textContent =
                "Employee deleted successfully.";

            await loadEmployees();

        } catch (error) {
            if (error.message !== "Authentication or authorization failed") {
                document.getElementById("message").textContent =
                    "Failed to delete employee.";
            }
        }
    }

    function clearForm() {
        editId = null;

        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("address").value = "";
        document.getElementById("department").value = "";
        document.getElementById("salary").value = "";

        document.getElementById("title").textContent = "Add Employee";
    }

    async function logout() {
        try {
            await fetch("/api/auth/logout", {
                method: "POST",
                credentials: "same-origin"
            });
        } finally {
            window.location.href = "/login.html";
        }
    }

    loadEmployees();
</script>

</body>
</html>
