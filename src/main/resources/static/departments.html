<!DOCTYPE html>
<html>
<head>
    <title>Department Management</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #667eea;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }

        .delete {
            background: #e74c3c;
        }

        .edit {
            background: #f39c12;
        }

        .dashboard {
            background: #333;
            margin-left: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🏢 Department Management</h1>
</div>

<div class="container">

    <div class="card">

        <h2 id="title">Add Department</h2>

        <input id="name" placeholder="Department Name">

        <input id="description" placeholder="Department Description">

        <button onclick="saveDepartment()">Save Department</button>

        <button onclick="clearForm()">Clear</button>

        <button class="dashboard"
                onclick="window.location.href='/dashboard.html'">
            Dashboard
        </button>

        <p id="message"></p>

    </div>

    <div class="card">

        <h2>Department List</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="departmentTable"></tbody>

        </table>

    </div>

</div>

<script>

let editId = null;

const username = sessionStorage.getItem("username");
const password = sessionStorage.getItem("password");

if (!username || !password) {
    window.location.href = "/login.html";
}

const auth = "Basic " + btoa(username + ":" + password);

function loadDepartments() {

    fetch("/api/departments", {
        headers: {
            "Authorization": auth
        }
    })
    .then(response => response.json())
    .then(data => {

        const table = document.getElementById("departmentTable");

        table.innerHTML = "";

        data.forEach(department => {

            table.innerHTML += `
                <tr>
                    <td>${department.id}</td>
                    <td>${department.name}</td>
                    <td>${department.description}</td>
                    <td>
                        <button class="edit"
                            onclick="editDepartment(${department.id})">
                            Edit
                        </button>

                        <button class="delete"
                            onclick="deleteDepartment(${department.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
        });
    })
    .catch(() => {

        document.getElementById("message").innerText =
            "Failed to load departments";
    });
}

function saveDepartment() {

    const department = {
        name: document.getElementById("name").value,
        description: document.getElementById("description").value
    };

    let url = "/api/departments";
    let method = "POST";

    if (editId !== null) {
        url = "/api/departments/" + editId;
        method = "PUT";
    }

    fetch(url, {
        method: method,
        headers: {
            "Authorization": auth,
            "Content-Type": "application/json"
        },
        body: JSON.stringify(department)
    })
    .then(response => response.json())
    .then(() => {

        document.getElementById("message").innerText =
            "Department saved successfully";

        clearForm();
        loadDepartments();
    })
    .catch(() => {

        document.getElementById("message").innerText =
            "Failed to save department";
    });
}

function editDepartment(id) {

    fetch("/api/departments/" + id, {
        headers: {
            "Authorization": auth
        }
    })
    .then(response => response.json())
    .then(department => {

        editId = department.id;

        document.getElementById("name").value =
            department.name;

        document.getElementById("description").value =
            department.description;

        document.getElementById("title").innerText =
            "Update Department";
    });
}

function deleteDepartment(id) {

    if (!confirm("Delete this department?")) {
        return;
    }

    fetch("/api/departments/" + id, {
        method: "DELETE",
        headers: {
            "Authorization": auth
        }
    })
    .then(response => response.text())
    .then(message => {

        document.getElementById("message").innerText = message;

        loadDepartments();
    });
}

function clearForm() {

    editId = null;

    document.getElementById("name").value = "";
    document.getElementById("description").value = "";

    document.getElementById("title").innerText =
        "Add Department";
}

loadDepartments();

</script>

</body>
</html>
