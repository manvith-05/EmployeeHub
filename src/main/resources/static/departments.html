<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Management - EmployeeHub</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .header {
            background: #667eea;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            color: white;
            margin: 4px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-btn {
            background: #555;
        }

        .save-btn {
            background: #667eea;
        }

        .clear-btn {
            background: #777;
        }

        .edit-btn {
            background: #f39c12;
        }

        .delete-btn {
            background: #e74c3c;
        }

        .logout-btn {
            background: #c0392b;
        }

        .form-box,
        .table-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .form-box h2 {
            color: #667eea;
            margin-top: 0;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .table-box {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 14px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
            overflow-wrap: anywhere;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            white-space: pre-wrap;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
                margin: 15px auto;
            }

            .form-box,
            .table-box {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>EmployeeHub</h1>
    <p>Department Management</p>
</div>

<div class="container">
    <div class="top-bar">
        <h2>Department Management</h2>
        <div>
            <button class="back-btn" onclick="goDashboard()">Dashboard</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="form-box">
        <h2 id="formTitle">Add Department</h2>

        <input type="text" id="name" placeholder="Department Name" maxlength="100">

        <textarea id="description" placeholder="Department Description"></textarea>

        <button class="save-btn" id="saveButton" onclick="saveDepartment()">
            Save Department
        </button>

        <button class="clear-btn" onclick="clearForm()">Clear</button>

        <div id="message" role="status" aria-live="polite"></div>
    </div>

    <div class="table-box">
        <h2>Department List</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Department Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="departmentTable"></tbody>
        </table>
    </div>
</div>

<script>
let editId = null;

const message = document.getElementById("message");
const table = document.getElementById("departmentTable");
const saveButton = document.getElementById("saveButton");

async function apiRequest(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        credentials: "same-origin",
        headers: {
            ...(options.headers || {})
        }
    });

    if (response.status === 401 || response.status === 403) {
        throw new Error(
            response.status === 401
                ? "Your login session has expired. Please log in again."
                : "Access denied. Please log in with an admin account."
        );
    }

    if (!response.ok) {
        const details = await response.text();
        throw new Error(details || "Request failed: " + response.status);
    }

    return response;
}

function showError(error, fallback) {
    message.textContent = error.message || fallback;

    if (error.message.includes("login session") ||
        error.message.includes("Access denied")) {
        setTimeout(() => {
            window.location.replace("/login.html");
        }, 1800);
    }
}

async function loadDepartments() {
    table.replaceChildren();
    message.textContent = "Loading departments...";

    try {
        const response = await apiRequest("/api/departments");
        const departments = await response.json();

        table.replaceChildren();

        if (!Array.isArray(departments) || departments.length === 0) {
            message.textContent = "No departments found. Add your first department.";
            return;
        }

        departments.forEach(department => {
            const row = document.createElement("tr");

            [department.id, department.name, department.description].forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value ?? "";
                row.appendChild(cell);
            });

            const actions = document.createElement("td");

            const editButton = document.createElement("button");
            editButton.className = "edit-btn";
            editButton.textContent = "Edit";
            editButton.onclick = () => editDepartment(department.id);

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-btn";
            deleteButton.textContent = "Delete";
            deleteButton.onclick = () => deleteDepartment(department.id);

            actions.append(editButton, deleteButton);
            row.appendChild(actions);
            table.appendChild(row);
        });

        message.textContent = "";
    } catch (error) {
        showError(error, "Unable to load departments. Please try again.");
    }
}

async function saveDepartment() {
    const name = document.getElementById("name").value.trim();
    const description = document.getElementById("description").value.trim();

    if (!name) {
        message.textContent = "Please enter department name.";
        return;
    }

    const department = { name, description };
    const isEditing = editId !== null;
    const url = isEditing
        ? "/api/departments/" + editId
        : "/api/departments";

    saveButton.disabled = true;
    message.textContent = "Saving department...";

    try {
        const response = await apiRequest(url, {
            method: isEditing ? "PUT" : "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(department)
        });

        const result = await response.text();

        clearForm();
        message.textContent = result ||
            (isEditing
                ? "Department updated successfully."
                : "Department added successfully.");

        await loadDepartments();
    } catch (error) {
        showError(error, "Failed to save department.");
    } finally {
        saveButton.disabled = false;
    }
}

async function editDepartment(id) {
    try {
        const response = await apiRequest("/api/departments/" + id);
        const department = await response.json();

        document.getElementById("name").value = department.name || "";
        document.getElementById("description").value =
            department.description || "";

        editId = department.id;
        document.getElementById("formTitle").textContent = "Update Department";
        saveButton.textContent = "Update Department";
        message.textContent = "Editing department ID: " + id;

        window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (error) {
        showError(error, "Unable to load department details.");
    }
}

async function deleteDepartment(id) {
    if (!confirm("Are you sure you want to delete this department?")) {
        return;
    }

    try {
        await apiRequest("/api/departments/" + id, {
            method: "DELETE"
        });

        clearForm();
        message.textContent = "Department deleted successfully.";
        await loadDepartments();
    } catch (error) {
        showError(error, "Failed to delete department.");
    }
}

function clearForm() {
    document.getElementById("name").value = "";
    document.getElementById("description").value = "";
    document.getElementById("formTitle").textContent = "Add Department";
    saveButton.textContent = "Save Department";
    editId = null;
}

function goDashboard() {
    window.location.href = "/dashboard.html";
}

async function logout() {
    try {
        await fetch("/api/auth/logout", {
            method: "POST",
            credentials: "same-origin"
        });
    } finally {
        window.location.replace("/login.html");
    }
}

loadDepartments();
</script>

</body>
</html>
